# llm-model-resolver — Economy profile
# Picks the cheapest eligible model by actual API-reported price, not by name heuristics.
# The xAI /v1/language-models endpoint returns prompt_text_token_price for every model;
# order: cheapest sorts by that field ascending so a new expensive model (like grok-4.7)
# is ranked below a cheaper one automatically, regardless of its name or release date.
#
# Prices as of 2026-09-29 (confirmed from live API response):
#   grok-4-fast / grok-4.1-fast    $0.20/$0.50 per M   ← cheapest
#   grok-4.3                       $1.25/$2.50 per M   ← next cheapest
#   grok-4.20-*-reasoning          $1.25/$2.50 per M   (same price tier as 4.3)
#   grok-4.7                       $2.00/$6.00 per M   ← excluded by price, not by name
#
# The pin field is available for cost-ceiling enforcement or CI reproducibility,
# but is not needed for normal economy operation — price sorting handles it.

global:
  timeoutMs:  300000
  cooldownMs: 60000
  order:      cheapest   # sort eligible models by API-reported price, cheapest first

providers:

  xai:
    include:  "^grok-"
    # Exclude non-chat models and the non-reasoning paired variant.
    # Reasoning is NOT excluded by name — price ordering already ranks cheaper
    # models ahead of expensive reasoning ones without needing to know the name.
    exclude:  "non-?reasoning|image|imagine|video|code-fast"
    # pin: "grok-4.3"   # uncomment for cost-ceiling enforcement or CI reproducibility
    fallback: "grok-4.3"

  anthropic:
    include:  "^claude-"
    exclude:  "instant|mini"
    fallback: "claude-haiku-4-5"

  gemini:
    include:  "gemini-"
    exclude:  "lite|embedding|aqa|imagen|veo|tts|live|image|audio"
    fallback: "gemini-flash-latest"

  openrouter:
    fallback: "openrouter/free"
